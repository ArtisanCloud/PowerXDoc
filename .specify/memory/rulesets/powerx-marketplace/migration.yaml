# Migration 纪律
kind: ruleset
id: crud_migration
version: 1.0.0
# 数据种子执行入口：`go run ./cmd/database seed`（禁止绕过 Go 程序）
# 所有结构变更必须有显式 SQL 脚本，生产环境禁用 AutoMigrate；SQL 以 `YYYYMMDD_<name>.sql` 命名，按日期排序可回滚
checks:
  - id: migration-exist
    desc: 所有模型均有迁移脚本；幂等/可回滚
    assert:
      type: path
      target: backend/migrations/**
  - id: migration-rls
    desc: RLS 策略存在且启用
    assert:
      type: grep
      target: backend/migrations/**
      pattern:
        - "ALTER TABLE"
        - "USING (tenant_id = current_setting('app.tenant_id')::uuid)"
