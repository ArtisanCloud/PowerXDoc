# DTO 与校验
kind: ruleset
id: crud_dto
version: 1.0.0
checks:
  - id: dto-exist
    desc: Create/Update/List DTO 均存在且字段与 Model 对齐（必要字段除外）
    assert:
      type: path
      target: backend/internal/dto/**
  - id: dto-validate-tags
    desc: DTO 字段有校验标签（binding/validate）
    assert:
      type: grep
      target: backend/internal/dto/**
      pattern:
        - validate:
  - id: dto-prefer-model
    desc: 返回体优先直接复用带 json tag 的 GORM 模型
    assert:
      type: doc
      value: |
        若无脱敏/裁剪需求，HTTP 层直接返回 domain model（已补充 json 标签），避免重复定义 DTO 与手动映射。
        仅在需要隐藏字段、追加派生属性或脱敏时才定义专用 DTO。
